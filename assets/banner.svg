  <text x="48" y="132" fill="#f3f1e9" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-2">Build with intent.</text>
  <text x="50" y="182" fill="#b5c2c6" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="2">IDEAS → TOOLS → REAL WORK</text>
  <g fill="none" stroke="#5ee0c0" stroke-width="2">
